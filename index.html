<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etz Chaim — Kundalini</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <button id="mobile-toggle" aria-label="Toggle sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
    </button>

    <div id="app">
        <aside id="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">Etz Chaim</h1>
                <p class="tagline">Kundalini rising through the central pillar.</p>
            </div>

            <!-- DETAIL PANEL — always visible, primary info display -->
            <div id="detail-panel">
                <div id="detail-empty">
                    <span class="detail-hint">Hover or click a node to explore</span>
                </div>
                <div id="detail-content" class="hidden">
                    <div id="detail-color-bar"></div>
                    <div id="detail-name"></div>
                    <div id="detail-hebrew"></div>
                    <div id="detail-desc"></div>
                    <div id="detail-chakra"></div>
                    <div id="detail-connections"></div>
                </div>
            </div>

            <!-- SEARCH -->
            <div class="section">
                <div class="search-wrap">
                    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" id="search-input" placeholder="Find a sephirah..." autocomplete="off">
                </div>
                <div id="search-results" class="hidden"></div>
            </div>

            <div class="section">
                <h3 class="section-title">Layers</h3>
                <div class="btn-row">
                    <button class="toggle-btn on" data-layer="man">Manifest</button>
                    <button class="toggle-btn on" data-layer="hid">Hidden</button>
                    <button class="toggle-btn on" data-layer="qlp">Qliphoth</button>
                    <button class="toggle-btn on" data-layer="tun">Tunnels</button>
                    <button class="toggle-btn on" data-layer="kun">Kundalini</button>
                </div>
            </div>

            <div class="section">
                <h3 class="section-title">Labels</h3>
                <div class="btn-row">
                    <button class="toggle-btn on" data-label="nlab">Nodes</button>
                    <button class="toggle-btn" data-label="plab">Paths</button>
                    <button class="toggle-btn" data-label="heb">Hebrew</button>
                </div>
            </div>

            <div class="section">
                <h3 class="section-title">Flow</h3>
                <div class="btn-row">
                    <button class="toggle-btn on" data-flow="both">Both</button>
                    <button class="toggle-btn" data-flow="light">Lightning</button>
                    <button class="toggle-btn" data-flow="serp">Serpent</button>
                </div>
            </div>

            <div class="section collapsed" id="params-section">
                <h3 class="section-title section-toggle" data-toggle="params-section">
                    Parameters
                    <svg class="chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                </h3>
                <div class="section-body">
                    <div class="param">
                        <label>Auto Rotation</label>
                        <div class="param-row">
                            <input type="range" data-param="rot" min="0" max="1" step="0.05" value="0.12">
                            <span class="param-val" data-display="rot">0.12</span>
                        </div>
                    </div>
                    <div class="param">
                        <label>Prism Radius</label>
                        <div class="param-row">
                            <input type="range" data-param="rad" min="1.5" max="6" step="0.1" value="3.5">
                            <span class="param-val" data-display="rad">3.5</span>
                        </div>
                    </div>
                    <div class="param">
                        <label>Pulse</label>
                        <div class="param-row">
                            <input type="range" data-param="pul" min="0.2" max="3" step="0.1" value="1.0">
                            <span class="param-val" data-display="pul">1.0</span>
                        </div>
                    </div>
                    <div class="param">
                        <label>Helix Turns</label>
                        <div class="param-row">
                            <input type="range" data-param="hlx" min="1" max="6" step="0.5" value="3">
                            <span class="param-val" data-display="hlx">3</span>
                        </div>
                    </div>
                    <div class="param">
                        <label>Flow Speed</label>
                        <div class="param-row">
                            <input type="range" data-param="spd" min="0.5" max="4" step="0.1" value="1.5">
                            <span class="param-val" data-display="spd">1.5</span>
                        </div>
                    </div>
                    <div class="param">
                        <label>Kundalini Intensity</label>
                        <div class="param-row">
                            <input type="range" data-param="kint" min="0.2" max="3" step="0.1" value="1.5">
                            <span class="param-val" data-display="kint">1.5</span>
                        </div>
                    </div>
                    <div class="param">
                        <label>Kundalini Width</label>
                        <div class="param-row">
                            <input type="range" data-param="kwid" min="0.3" max="2" step="0.1" value="0.8">
                            <span class="param-val" data-display="kwid">0.8</span>
                        </div>
                    </div>
                    <div class="param">
                        <label>Bloom Strength</label>
                        <div class="param-row">
                            <input type="range" data-param="bloom" min="0" max="3" step="0.1" value="0.8">
                            <span class="param-val" data-display="bloom">0.8</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section">
                <h3 class="section-title">View</h3>
                <div class="btn-row">
                    <button class="toggle-btn on" data-view="orb">Orbit</button>
                    <button class="toggle-btn" data-view="top">Top</button>
                    <button class="toggle-btn" data-view="sid">Side</button>
                </div>
            </div>

            <div class="sidebar-footer">
                <span>Drag to rotate · Scroll to zoom · Hover for details</span>
            </div>
        </aside>

        <main id="canvas-wrap">
            <canvas id="three-canvas"></canvas>
            <div id="labels-container"></div>

            <!-- KNOWLEDGE DRAWER -->
            <div id="knowledge-drawer" class="collapsed">
                <div id="drawer-handle">
                    <div class="handle-bar"></div>
                    <span id="drawer-title">Connections &amp; Correspondences</span>
                    <svg class="drawer-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 15 12 9 18 15"/></svg>
                </div>
                <div id="drawer-body">
                    <div id="drawer-tabs">
                        <button class="drawer-tab active" data-tab="paths">22 Paths</button>
                        <button class="drawer-tab" data-tab="pillars">Pillars</button>
                        <button class="drawer-tab" data-tab="tunnels">Tunnels</button>
                        <button class="drawer-tab" data-tab="hidden">Hidden</button>
                        <button class="drawer-tab" data-tab="overview">Overview</button>
                    </div>
                    <div id="drawer-content"></div>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
